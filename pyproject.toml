[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document2md"
description = "Convert a PDF or a set of scanned page images to Markdown via OCR."
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.10 for the PEP 604 unions (`X | None`) the package evaluates at import:
# they sit in function signatures, so they run when the module is defined.
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.31",
    # pymupdf4llm 2.0 on PyPI is a 904-byte wheel with no dependencies and no
    # requires-python, so on Python 3.10 (which 2.1 excludes) pip picked it and
    # `import pymupdf` failed (CI, 2026-11-06). Excluding it resolves 3.10 to
    # 1.28.2 and 3.11+ to 2.1; pymupdf is declared too because the backend
    # imports it directly.
    "pymupdf4llm>=1.28,!=2.0",
    "pymupdf>=1.28",
]
dynamic = ['version']

[project.optional-dependencies]
mineru = ["mineru[pipeline]"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/legistlan/document2md"

[project.scripts]
document2md = "document2md.cli:main"

[tool.setuptools.packages.find]
include = ["document2md", "document2md.*"]

[tool.setuptools.dynamic]
version = {attr = 'document2md.__version__'}
